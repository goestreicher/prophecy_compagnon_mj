name: prophecy_compagnon_mj
description: "A companion app for the Prophecy RPG"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  animated_tree_view: ^2.0.0
  cupertino_icons: ^1.0.0
  file_picker: ^11.0.0
  fleather: ^1.0.0
  float_column: ^4.0.0
  go_router: ^17.0.0
  material_symbols_icons: ^4.0.0
  parchment: ^1.0.0
  prophecy_compagnon_shared: ^0.1.0
  provider: ^6.0.0
  scrollable_positioned_list: ^0.3.0
  uuid: ^4.3.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build: ^4.0.0
  build_runner: ^2.0.0
  glob: ^2.1.0
  json_serializable: ^6.0.0
  source_gen: ^4.1.0

flutter:
  uses-material-design: true
